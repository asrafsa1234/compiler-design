name: Compile and capture all 40 exercises
on:
  push:
  workflow_dispatch:
jobs:
  compiler-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flex gcc imagemagick fonts-dejavu-core
      - run: bash run_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs-and-screenshots
          path: |
            Q*/output.txt
            Q*/output.png
